{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container-fluid px-0" style="max-width: 780px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="rounded-3 bg-primary bg-opacity-10 p-3 text-primary">
      <i class="bi bi-pencil-square fs-3"></i>
    </div>
    <div>
      <h1 class="h3 mb-1 fw-bold text-dark">{{ title }}</h1>
      <p class="text-muted small mb-0">Veuillez renseigner les informations ci-dessous.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4 p-md-5">
      <form method="post" novalidate {% if multipart %}enctype="multipart/form-data"{% endif %}>
        {% include "administration/_form_fields.html" %}
        <div class="d-flex justify-content-between align-items-center pt-4 border-top mt-4 flex-wrap gap-2">
          <a class="btn btn-outline-secondary px-4" href="{% if cancel_arg %}{% url cancel_url cancel_arg %}{% else %}{% url cancel_url %}{% endif %}">
            <i class="bi bi-arrow-left me-1"></i>Annuler
          </a>
          <button type="submit" class="btn btn-primary px-4 shadow-sm">
            <i class="bi bi-check-lg me-1"></i>Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
